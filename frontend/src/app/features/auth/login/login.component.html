<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Examen App - Plataforma de evaluaciones</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" />
        </mat-form-field>

        @if (showMfa) {
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Código MFA (Google Authenticator)</mat-label>
            <input matInput formControlName="mfa_code" maxlength="6" />
          </mat-form-field>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="form.invalid">
          Ingresar
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/register">Crear cuenta</a>
    </mat-card-actions>
  </mat-card>
</div>
