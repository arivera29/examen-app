<mat-sidenav-container class="layout">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <mat-icon>school</mat-icon>
      <span>Examen App</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>
      <a mat-list-item routerLink="/dashboard/banks" routerLinkActive="active">
        <mat-icon matListItemIcon>library_books</mat-icon>
        <span matListItemTitle>Bancos de preguntas</span>
      </a>
      <a mat-list-item routerLink="/dashboard/topics" routerLinkActive="active">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Temáticas</span>
      </a>
      <a mat-list-item routerLink="/dashboard/exams" routerLinkActive="active">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Exámenes</span>
      </a>
      <a mat-list-item routerLink="/dashboard/mfa" routerLinkActive="active">
        <mat-icon matListItemIcon>security</mat-icon>
        <span matListItemTitle>Configurar MFA</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Mi Workspace</span>
      <span class="spacer"></span>
      @if (auth.currentUser$ | async; as user) {
        <span class="user-name">{{ user.full_name }}</span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
